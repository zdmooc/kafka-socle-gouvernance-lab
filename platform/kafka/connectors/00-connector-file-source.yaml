# Connecteur FileStreamSource (fourni par Kafka Connect)
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: file-source-demo
  labels:
    strimzi.io/cluster: socle-connect
spec:
  class: org.apache.kafka.connect.file.FileStreamSourceConnector
  tasksMax: 1
  config:
    file: /opt/kafka/LICENSE
    topic: demo.events.v1
