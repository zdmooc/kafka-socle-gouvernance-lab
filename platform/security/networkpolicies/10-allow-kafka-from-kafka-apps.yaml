apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-from-kafka-apps
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: socle-kafka-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              purpose: kafka-clients
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9092
